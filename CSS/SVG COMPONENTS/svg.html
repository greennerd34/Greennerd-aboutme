<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Daquita, Songcuya, Salarda, Estacio">

    <title>Mario SVG</title>
    <style>
        body{
            margin: 0 ;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        svg{
            width: 350px; 
        }
    </style>

</head>
<body>

    <svg viewBox="0 0 160 160">

        <!--Background :D-->
        <rect width="160" height="160" fill=" #87CEEB"/>
        <rect y="140" width="160" height="20" fill="#7C4A1F"/>

        <!--The REAL MARIO-->
        <rect x="50" y="20" width="60" height="10" fill="#D32F2F"/>
        <rect x="40" y="30" width="80" height="10" fill="#D32F2F"/>

        <rect x="50" y="40" width="60" height="40" fill="#F6C28B"/>

        <rect x="40" y="40" width="10" height="40" fill="#5D4037"/>
        <rect x="110" y="40" width="10" height="40" fill="#5D4037"/>

        <rect x="65" y="55" width="6" height="10" fill="#000000"/>
        <rect x="89" y="55" width="6" height="10" fill="#000000"/>

        <rect x="60" y="70" width="40" height="6" fill="#5D4037"/>

        <rect x="50" y="80" width="60" height="30" fill="#E53935"/>
        <rect x="55" y="90" width="20" height="40" fill="#1976D2"/>
        <rect x="85" y="90" width="20" height="40" fill="#1976D2"/>

        <!--The BODY PARTS OF MARIO :P-->
        <rect x="35" y="85" width="15" height="30" fill="#F6C28B"/>
        <rect x="110" y="85" width="15" height="30" fill="#F6C28B"/>
        <rect x="55" y="130" width="20" height="10" fill="#5D4037"/>
        <rect x="85" y="130" width="20" height="10" fill="#5D4037"/>
    
    </svg> 
</body>
</html>
